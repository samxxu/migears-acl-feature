name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest

    name: Coverage threshold

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # PHPUnit has no native coverage threshold, so the gate is explicit: the
      # line-coverage percentage from the text report is compared against
      # MIN_LINE_COVERAGE and the job fails when it falls below it.
      - name: Enforce the line coverage threshold
        env:
          MIN_LINE_COVERAGE: '100'
        run: |
          vendor/bin/phpunit --coverage-text > phpunit-coverage.txt
          cat phpunit-coverage.txt
          coverage="$(sed -n 's/^ *Lines: *\([0-9.]*\)%.*/\1/p' phpunit-coverage.txt)"
          echo "Line coverage: ${coverage}% (threshold: ${MIN_LINE_COVERAGE}%)"
          awk -v c="${coverage}" -v min="${MIN_LINE_COVERAGE}" 'BEGIN { exit !(c + 0 >= min) }' \
            || { echo "::error::line coverage ${coverage}% is below the ${MIN_LINE_COVERAGE}% threshold"; exit 1; }
